name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      - name: Browser e2e (Web Test Runner + headless Chrome)
        run: npx wtr --config web-test-runner.config.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
